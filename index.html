<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI社員キット 試用デモ — 対話の記録で分かる進め方</title>
<meta name="description" content="AI社員を雇って最初の仕事を任せるまでの流れを、対話の記録で読めます。プロンプト本文は非公開のため文字数だけを表示します。">
<style>
:root{
  --bg:#f7f7f5; --card:#ffffff; --line:#e3e1da; --text:#2b2b28; --sub:#6f6d66;
  --accent:#2f6f5f; --accent-soft:#e8f1ee; --you-bg:#eef3fa; --ai-bg:#f2f7f4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;line-height:1.7;font-size:15px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 64px}
header{background:var(--accent);color:#fff;padding:32px 16px 28px;text-align:center}
header h1{margin:0 0 8px;font-size:22px;line-height:1.4}
header p{margin:0;font-size:13px;opacity:.92}
.note{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin:20px 0;font-size:13px;color:var(--sub)}
.note b{color:var(--text)}
.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:22px 0 6px}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 10px;font-size:14px;cursor:pointer;text-align:left;font-family:inherit;color:var(--text);transition:border-color .15s}
.tabs button small{display:block;color:var(--sub);font-size:12px;margin-top:2px}
.tabs button.active{border-color:var(--accent);background:var(--accent-soft)}
.tabs button.active b{color:var(--accent)}
.persona{font-size:13px;color:var(--sub);margin:10px 0 22px;padding-left:10px;border-left:3px solid var(--line)}
.step{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 18px;overflow:hidden}
.step-head{display:flex;align-items:baseline;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.step-no{background:var(--accent);color:#fff;border-radius:6px;font-size:12px;padding:2px 10px;font-weight:bold}
.step-title{font-weight:bold;font-size:15px}
.step-time{margin-left:auto;font-size:12px;color:var(--sub)}
.step-body{padding:14px 18px}
.prompt-card{border:1.5px dashed var(--accent);background:var(--accent-soft);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.prompt-card .chars{font-weight:bold;color:var(--accent)}
.prompt-card .why{display:block;font-size:12.5px;color:var(--sub);margin-top:4px}
.msg{border-radius:10px;padding:10px 14px;margin:10px 0;font-size:14px;white-space:pre-wrap}
.msg .who{display:block;font-size:11.5px;font-weight:bold;margin-bottom:4px}
.msg.you{background:var(--you-bg);margin-left:32px}
.msg.you .who{color:#3a5a8c}
.msg.ai{background:var(--ai-bg);margin-right:32px}
.msg.ai .who{color:var(--accent)}
.artifact{font-size:13px;color:var(--sub);border-top:1px dashed var(--line);margin-top:12px;padding-top:8px}
.result{background:var(--card);border:2px solid var(--accent);border-radius:12px;padding:16px 18px;margin:26px 0}
.result h2{margin:0 0 10px;font-size:16px;color:var(--accent)}
.result pre{margin:0;white-space:pre-wrap;font-family:inherit;font-size:13.5px;background:var(--bg);border-radius:8px;padding:12px 14px}
.cta{margin:34px 0 12px;text-align:center}
.cta p{font-size:14px;margin:0 0 12px}
.cta a{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:bold;font-size:15px;padding:14px 42px;border-radius:28px}
.cta small{display:block;margin-top:10px;font-size:12px;color:var(--sub)}
footer{margin-top:40px;text-align:center;font-size:12px;color:var(--sub)}
@media(max-width:520px){.tabs{grid-template-columns:1fr}.msg.you{margin-left:8px}.msg.ai{margin-right:8px}}
</style>
</head>
<body>
<header>
  <h1>AI社員キット 試用デモ</h1>
  <p>対話の記録を読むだけで、雇ってから最初の仕事が終わるまでの流れと成果物が分かります</p>
</header>
<div class="wrap">
  <div class="note">
    このページは<b>実行の記録</b>を読む形式のデモです（AIが動くページではありません）。商品に書かれたプロンプト本文は非公開のため、「約◯文字」という目安だけを表示します。あなたがやるのは<b>番号で答えること</b>と、プロンプトを貼り付けることだけ。すべて記録のとおりに進みます。
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="persona"></div>
  <div id="steps"></div>
  <div id="result"></div>
  <div class="cta">
    <p>記録の流れがイメージできたら、実際にあなたのAI社員を雇えます。</p>
    <a href="https://brain-market.com/u/tokyo_ai_sol/a/b2EjN3YjMgoTZsNWa0JXY" rel="noopener">商品を見る（目安60分・今日から雇える）</a>
    <small>デモはここで終わりです。商品ページに戻ります。</small>
  </div>
  <footer>AI社員キット 試用デモ</footer>
</div>
<script src="data.js"></script>
<script>
const tabsEl=document.getElementById('tabs');
const personaEl=document.getElementById('persona');
const stepsEl=document.getElementById('steps');
const resultEl=document.getElementById('result');

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function render(sc){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.id===sc.id));
  personaEl.innerHTML='<p class="persona"><b>このシナリオで試す人:</b> '+esc(sc.persona)+'<br><b>任せる仕事:</b> '+esc(sc.goal)+'（役割: '+esc(sc.label)+'）</p>';
  stepsEl.innerHTML=sc.steps.map(st=>{
    let html='<div class="step"><div class="step-head"><span class="step-no">'+esc(st.step)+'</span><span class="step-title">'+esc(st.title)+'</span><span class="step-time">目安 '+esc(st.time)+'</span></div><div class="step-body">';
    html+='<div class="prompt-card">📋 ここで商品に書かれたプロンプト（<span class="chars">'+esc(st.prompt.chars)+'</span>）を貼り付けます<span class="why">'+esc(st.prompt.note)+'</span></div>';
    if(st.dialogue.length===0){
      html+='<div class="msg ai"><span class="who">ミナト</span>初回報告（3行）・明日の一手・雇用カードを出して、1日目が完了します。</div>';
    }else{
      html+=st.dialogue.map(d=>
        '<div class="msg you"><span class="who">あなた</span>'+esc(d.you)+'</div>'+
        '<div class="msg ai"><span class="who">ミナト</span>'+esc(d.ai)+'</div>'
      ).join('');
    }
    if(st.artifact) html+='<div class="artifact">💾 この時点でできているもの: '+esc(st.artifact)+'</div>';
    return html+'</div></div>';
  }).join('');
  resultEl.innerHTML='<div class="result"><h2>🏁 最終成果物: 雇用カード</h2><pre>'+esc(sc.result)+'</pre></div>';
}

SCENARIOS.forEach((sc,i)=>{
  const b=document.createElement('button');
  b.dataset.id=sc.id;
  b.innerHTML='<b>'+esc(sc.label)+'</b><small>'+esc(sc.goal)+'</small>';
  b.addEventListener('click',()=>render(sc));
  tabsEl.appendChild(b);
});
render(SCENARIOS[0]);
</script>
</body>
</html>
